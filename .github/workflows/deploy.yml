name: Deploy frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, axis-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, build, and restart
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          cd /web/axis/AXIS-frontend
          git fetch origin main
          # Reset to FETCH_HEAD, not origin/main: on older git, a branch-specific
          # fetch does not update the remote-tracking ref, so resetting to
          # origin/main silently deploys the PREVIOUS push (one behind).
          git reset --hard FETCH_HEAD
          npm ci
          npm run build
          pm2 restart axis-frontend
