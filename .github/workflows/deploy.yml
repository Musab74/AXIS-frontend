name: Deploy frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, axis-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install, build, and restart
        env:
          HOME: /root
          PM2_HOME: /root/.pm2
        run: |
          cd /web/axis/AXIS-frontend
          # Fetch the canonical repo by explicit URL — this clone's `origin`
          # remote is stale on the server (fetching it rebuilt the same old
          # tree every deploy while GitHub main moved on), and reset to
          # FETCH_HEAD, which works on any git version.
          git fetch ${{ github.server_url }}/${{ github.repository }} main
          git reset --hard FETCH_HEAD
          npm ci
          npm run build
          pm2 restart axis-frontend
